<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 幕山 Moshine 图形 Mark：44×44 圆角方块 + 负形「幕布齿孔 + 三竖山峰」 -->
  <!-- 幕 = 银幕齿孔（顶部 3 个方孔），山 = 底部三竖山峰（双重隐喻） -->
  <!-- 纯黑填充，无渐变，符合品牌「极致黑白极简」定位 -->
  <rect width="64" height="64" rx="20" fill="#0a0a0a"/>
  <!-- 幕布齿孔：顶部 3 个小方孔（负形 = 透出背景色） -->
  <rect x="24" y="12" width="4" height="7" rx="1" fill="#ffffff"/>
  <rect x="30" y="12" width="4" height="7" rx="1" fill="#ffffff"/>
  <rect x="36" y="12" width="4" height="7" rx="1" fill="#ffffff"/>
  <!-- 三竖山峰：底部三个不同高度的竖条，构成山形 -->
  <rect x="20" y="30" width="7" height="22" rx="1" fill="#ffffff"/>
  <rect x="28.5" y="22" width="7" height="30" rx="1" fill="#ffffff"/>
  <rect x="37" y="34" width="7" height="18" rx="1" fill="#ffffff"/>
</svg>
